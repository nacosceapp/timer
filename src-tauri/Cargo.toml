[package]
name = "nac-osce-timer"
version = "0.1.7"
description = "NAC OSCE Timer desktop app"
authors = ["NAC OSCE Timer"]
edition = "2021"

[lib]
name = "nac_osce_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
